<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rollcall</title>
    <style>
      :root {
        --bg: #0f172a;
        --bg-accent: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --start: #22c55e;
        --start-hover: #16a34a;
        --stop: #ef4444;
        --stop-hover: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #1d4ed8 0%, var(--bg) 55%);
        display: grid;
        place-items: center;
      }

      .panel {
        width: min(92vw, 760px);
        padding: 56px 40px;
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.92));
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 20px 60px rgba(2, 6, 23, 0.48);
        text-align: center;
      }

      .status {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 7rem);
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1;
        text-shadow: 0 10px 28px rgba(15, 23, 42, 0.65);
        transition: color 0.25s ease, text-shadow 0.25s ease, transform 0.25s ease;
      }

      .status-highlight {
        color: #fef08a;
        text-shadow: 0 0 24px rgba(250, 204, 21, 0.6), 0 10px 28px rgba(15, 23, 42, 0.65);
        transform: scale(1.02);
      }

      .subtitle {
        margin: 14px 0 20px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .members {
        min-height: 1.6em;
        margin: 0 0 28px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .btn {
        border: 0;
        border-radius: 12px;
        min-width: 140px;
        padding: 14px 26px;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        cursor: default;
        opacity: 0.5;
        transform: none;
      }

      .btn-start {
        background: var(--start);
        box-shadow: 0 10px 24px rgba(34, 197, 94, 0.32);
      }

      .btn-start:hover {
        background: var(--start-hover);
      }

      .btn-stop {
        background: var(--stop);
        box-shadow: 0 10px 24px rgba(239, 68, 68, 0.3);
      }

      .btn-stop:hover {
        background: var(--stop-hover);
      }

      .btn-reset {
        background: #475569;
      }

      .btn-reset:hover {
        background: #64748b;
      }

      .music-toggle {
        margin-top: 22px;
        padding: 8px 14px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .music-toggle:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1 class="status" id="statusDisplay" aria-live="polite">Ready</h1>
      <p class="subtitle" id="subtitle">Loading groups...</p>
      <p class="members" id="membersDisplay"></p>
      <div class="actions">
        <button class="btn btn-start" id="startButton" type="button" disabled>Start</button>
        <button class="btn btn-stop" id="stopButton" type="button" disabled>Stop</button>
        <button class="btn btn-reset" id="resetButton" type="button" disabled>Reset draws</button>
      </div>
      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="true">Music: On</button>
    </main>
    <audio id="drawMusic" src="{{ url_for('static', filename='audio/draw-loop.wav') }}" preload="none" loop></audio>
    <script>
      let groups = [];
      let cycleTimer = null;
      let loading = false;
      let drawing = false;
      let musicEnabled = true;

      const statusDisplay = document.getElementById("statusDisplay");
      const subtitle = document.getElementById("subtitle");
      const membersDisplay = document.getElementById("membersDisplay");
      const startButton = document.getElementById("startButton");
      const stopButton = document.getElementById("stopButton");
      const resetButton = document.getElementById("resetButton");
      const musicToggle = document.getElementById("musicToggle");
      const drawMusic = document.getElementById("drawMusic");
      drawMusic.volume = 0.35;

      function startBackgroundMusic() {
        if (!musicEnabled) {
          return;
        }
        // Start from the click handler so browsers allow audio playback.
        drawMusic.play().catch((error) => {
          console.debug("Background music unavailable:", error);
        });
      }

      function stopBackgroundMusic() {
        drawMusic.pause();
        drawMusic.currentTime = 0;
      }

      function toggleMusic() {
        musicEnabled = !musicEnabled;
        musicToggle.textContent = musicEnabled ? "Music: On" : "Music: Off";
        musicToggle.setAttribute("aria-pressed", String(musicEnabled));
        if (!musicEnabled) {
          stopBackgroundMusic();
        } else if (cycleTimer !== null) {
          startBackgroundMusic();
        }
      }

      function updateButtons() {
        startButton.disabled = loading || drawing || cycleTimer !== null || !groups.length;
        stopButton.disabled = drawing || cycleTimer === null;
        resetButton.disabled = loading || drawing || cycleTimer !== null;
      }

      async function loadGroups() {
        const response = await fetch("/api/groups", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }
        const data = await response.json();
        groups = Array.isArray(data) ? data : [];
      }

      async function resetDraws() {
        if (loading || drawing || cycleTimer !== null) {
          return;
        }
        if (!window.confirm("Clear all draw history and start a new round?")) {
          return;
        }

        loading = true;
        updateButtons();
        subtitle.textContent = "Resetting draw history...";
        try {
          const response = await fetch("/api/groups/reset", { method: "POST" });
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          groups = Array.isArray(data) ? data : [];
          stopBackgroundMusic();
          statusDisplay.textContent = "Ready";
          statusDisplay.classList.remove("status-highlight");
          membersDisplay.textContent = "";
          subtitle.textContent = groups.length
            ? `${groups.length} groups remaining`
            : "No groups available";
        } catch (error) {
          console.error("Failed to reset draw history:", error);
          subtitle.textContent = "Failed to reset draw history. Please try again.";
        } finally {
          loading = false;
          updateButtons();
        }
      }

      async function startCycling() {
        if (cycleTimer !== null || loading || drawing) {
          return;
        }

        loading = true;
        updateButtons();
        try {
          startBackgroundMusic();
          await loadGroups();
          if (!groups.length) {
            stopBackgroundMusic();
            subtitle.textContent = "No groups available";
            return;
          }

          statusDisplay.classList.remove("status-highlight");
          membersDisplay.textContent = "";
          subtitle.textContent = "Cycling through groups...";
          const showRandomGroup = () => {
            const randomIndex = Math.floor(Math.random() * groups.length);
            statusDisplay.textContent = groups[randomIndex].name;
          };
          showRandomGroup();
          cycleTimer = setInterval(showRandomGroup, 70);
          startBackgroundMusic();
        } catch (error) {
          stopBackgroundMusic();
          console.error("Failed to load groups:", error);
          subtitle.textContent = "Failed to load groups. Please try again.";
        } finally {
          loading = false;
          updateButtons();
        }
      }

      async function stopCycling() {
        if (cycleTimer === null || drawing) {
          return;
        }

        clearInterval(cycleTimer);
        cycleTimer = null;
        stopBackgroundMusic();
        drawing = true;
        updateButtons();
        subtitle.textContent = "Selecting group...";

        try {
          const response = await fetch("/api/groups/draw", { method: "POST" });
          if (!response.ok) {
            if (response.status === 409) {
              statusDisplay.textContent = "Ready";
              subtitle.textContent = "No groups available for this draw";
              return;
            }
            throw new Error(`Request failed with status ${response.status}`);
          }

          const winner = await response.json();
          groups = groups.filter((group) => group.id !== winner.id);
          statusDisplay.textContent = winner.name;
          membersDisplay.textContent = winner.members.join(" · ");
          statusDisplay.classList.add("status-highlight");
          subtitle.textContent = "Selected group";
        } catch (error) {
          console.error("Failed to select group:", error);
          statusDisplay.textContent = "Ready";
          subtitle.textContent = "Failed to select group. Please try again.";
        } finally {
          drawing = false;
          updateButtons();
        }
      }

      window.addEventListener("DOMContentLoaded", async () => {
        startButton.addEventListener("click", startCycling);
        stopButton.addEventListener("click", stopCycling);
        resetButton.addEventListener("click", resetDraws);
        musicToggle.addEventListener("click", toggleMusic);
        loading = true;
        updateButtons();
        try {
          await loadGroups();
          subtitle.textContent = groups.length
            ? `${groups.length} groups remaining`
            : "No groups available";
        } catch (error) {
          console.error("Failed to load groups:", error);
          subtitle.textContent = "Failed to load groups. Please reload the page.";
        } finally {
          loading = false;
          updateButtons();
        }
      });
    </script>
  </body>
</html>
